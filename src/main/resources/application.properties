spring.application.name=CareTracev2
spring.mongodb.uri=${MONGO_URI}
spring.mongodb.database=${DATABASE_NAME}
jwt.secret=${JWT_SECRET}
allow.origin=${ALLOW_ORIGIN}
gemini.key=${GEMINI_KEY}
expirtaion.duration=7
rekognition.access.key=${REKOGNITION_ACCESS_KEY}
rekognition.secret.key=${REKOGNITION_SECRET_KEY}
rekognition.region=${REKOGNITION_REGION}
s3.bucket=${S3_BUCKET}
s3.accesskey=${S3_BUCKET_ACCESS_KEY}
s3.secretkey=${S3_BUCKEY_SECRET_KEY}
s3.region=${S3_REGION}
spring.servlet.multipart.max-file-size=2MB
spring.servlet.multipart.max-request-size=3MB
s3.url.expiry.minutes=30
medication.missed.grace.minutes=60
